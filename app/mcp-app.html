<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lotus Wisdom</title>
<!-- Characters are drawn from Noto Serif TC outlines, (c) Adobe, under the
     SIL Open Font License 1.1 (https://openfontlicense.org). -->
<style>
/* A ring of pixels, a character per step, and the words. Three rules keep
   it small:
   - Colour is attention: only the step you are on, or pointing at, is in
     colour. The rest is ink until the circle closes.
   - One motion per event: a step dithers in, stillness breathes, completion
     fills with colour. Nothing moves in between.
   - Text is the tag and the words; the rest lives in labels and tooltips.
   The six colours are the Buddha's aura from the Buddhist flag. */

:root {
  color-scheme: dark;
  --bg: #08090c;
  --ink: #ebe7de;
  --ink-2: #a9a8b4;
  --ink-3: #6f7080;
  --slot: #2b2d38;
  --d-entry: #e6e3ee;   /* odāta: white */
  --d-process: #e66f86; /* lohita: red */
  --d-skill: #e3c065;   /* pīta: yellow */
  --d-nondual: #e5955f; /* mañjiṣṭha: orange */
  --d-meta: #63aede;    /* nīla: blue */
  --d-med: #c6bfe6;     /* prabhāsvara: the radiance of all five */
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eeece5;
  --ink: #16161c;
  --ink-2: #4a4954;
  --ink-3: #8d8b92;
  --slot: #d2cfc5;
  --d-entry: #4d4a63;
  --d-process: #b23a55;
  --d-skill: #7d6516;
  --d-nondual: #a3541f;
  --d-meta: #2e6ca8;
  --d-med: #635aa6;
}

.d-entry { --c: var(--d-entry) }
.d-process { --c: var(--d-process) }
.d-skill { --c: var(--d-skill) }
.d-nondual { --c: var(--d-nondual) }
.d-meta { --c: var(--d-meta) }
.d-med { --c: var(--d-med) }

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box }

html, body {
  width: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
}

#root {
  --c: var(--d-entry);
  display: flex; flex-direction: column; gap: 14px;
  padding: 16px 18px;
}

.main {
  display: grid; grid-template-columns: auto minmax(0, 1fr);
  gap: 20px; align-items: start;
}

/* --- Halo -------------------------------------------------------------- */

.halo {
  position: relative;
  width: clamp(96px, 24vw, 132px); aspect-ratio: 1 / 1;
  container-type: inline-size;
}
.halo > svg { position: absolute; inset: 0; width: 100%; height: 100% }

/* The ring is a grid of square pixels. Cells carry their 4x4 Bayer quartile
   (q0..q3), so density draws the shade ramp: future ▒, past ▓, now █. */
.slot rect { fill: var(--slot) }
.slot .q2, .slot .q3 { opacity: 0 }

.sn { outline: none; cursor: pointer }
.sn .px rect { fill: var(--ink-3); transition: fill .5s ease var(--k, 0s) }
.sn.past .q3 { opacity: 0 }
.sn:is(.now, .hol, .end, .pin, :hover, :focus-visible) .px rect { fill: var(--c); opacity: 1 }
/* Meditation is the flag's sixth band: a mosaic of all five colours. */
.sn:is(.now, .hol, .end, .pin, :hover, :focus-visible) .px .k0 { fill: var(--d-meta) }
.sn:is(.now, .hol, .end, .pin, :hover, :focus-visible) .px .k1 { fill: var(--d-skill) }
.sn:is(.now, .hol, .end, .pin, :hover, :focus-visible) .px .k2 { fill: var(--d-process) }
.sn:is(.now, .hol, .end, .pin, :hover, :focus-visible) .px .k3 { fill: var(--d-entry) }
.sn:is(.now, .hol, .end, .pin, :hover, :focus-visible) .px .k4 { fill: var(--d-nondual) }
.sn .hit { fill: none; stroke: transparent; stroke-width: 15; pointer-events: stroke }
.sn .fr { fill: none; stroke: var(--ink); stroke-width: 1.2; opacity: 0 }
.sn:focus-visible .fr { opacity: .9 }
.sn .pm { fill: var(--c); opacity: 0 }
.sn.pin .pm { opacity: 1 }

/* A step arrives: its cells dither in, ░ to █. */
.sn.now .px rect { animation: dot .01s linear both }
.sn.now .px .q1 { animation-delay: .09s }
.sn.now .px .q2 { animation-delay: .18s }
.sn.now .px .q3 { animation-delay: .27s }
/* Stillness breathes by density, ▒ to █ and back, three times. Each step is
   its own panel in a chat and old panels stay on screen, so nothing loops. */
.sn.hol .px .q2 { animation: breathe 4.4s steps(1, end) 3 }
.sn.hol .px .q3 { animation: breathe 4.4s steps(1, end) .55s 3 }

.core {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
#gk { display: flex; color: var(--c); pointer-events: auto; cursor: default }
#gk svg { display: block; height: 40px; height: 30cqw; width: auto; fill: currentColor }
#gk.idle { color: var(--ink-3) }

/* --- Words ------------------------------------------------------------- */

#ct { min-width: 0; opacity: 0; transition: opacity .4s ease }
#ct.on { opacity: 1 }
#ci { transition: opacity .16s ease }

.ch { margin: 1px 0 8px; font-size: 10.5px; line-height: 1.3; letter-spacing: .16em; text-transform: uppercase }
#ch { color: var(--ink-2) }

#cx {
  max-width: 68ch;
  font-size: 13.5px; line-height: 1.7;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
#cx.med-text { color: var(--ink-2) }
#cx:empty::before {
  content: "contemplated in an earlier frame";
  font-size: 12px; color: var(--ink-3);
}

@media (max-width: 380px) {
  .main { grid-template-columns: minmax(0, 1fr) }
  .halo { justify-self: center }
}

@keyframes dot { from { opacity: 0 } }
@keyframes breathe { 0% { opacity: 0 } 50% { opacity: 1 } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important }
}
</style>
</head>
<body>
<div id="root">
  <div class="main">
    <div class="halo">
      <svg id="tr" viewBox="0 0 120 120" role="group" aria-label="Contemplative journey" shape-rendering="crispEdges">
        <g id="gs"></g>
        <g id="gn"></g>
      </svg>
      <div class="core" aria-hidden="true">
        <span id="gk" class="idle"></span>
      </div>
    </div>
    <div id="ct">
      <div id="ci">
        <div class="ch"><span id="ch"></span></div>
        <p id="cx"></p>
      </div>
    </div>
  </div>
</div>
<script type="module" src="./src/mcp-app.ts"></script>
</body>
</html>
