name: CI & publish

# Verification (typechecks, tests, builds, audits) runs on PRs to main, version
# tags, and manual registry recovery. Tag pushes publish to npm, wait for the
# package to become visible, then register with MCP Registry. Manual recovery
# registers an existing tag without republishing npm. Both use GitHub OIDC:
#   - npm: requires a Trusted Publisher configured for this repo + this workflow
#     on npmjs.com (package Settings -> Trusted Publisher). npm >= 11.5.1
#     auto-detects the Actions OIDC and publishes with provenance, no token.
#   - MCP Registry: `mcp-publisher login github-oidc` proves ownership of the
#     io.github.linxule/* namespace.
#
# Release flow: bump src/shared/version.ts -> `bun run sync-version` -> commit ->
# `git tag vX.Y.Z && git push origin vX.Y.Z`. No tokens, no manual publish.

on:
  workflow_dispatch:
    inputs:
      registry_tag:
        description: "Existing release tag to register with MCP Registry (npm is not republished)"
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  id-token: write # npm + mcp-publisher OIDC (tag runs only)
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.registry_tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Typecheck app
        working-directory: app
        run: bunx tsc --noEmit

      - name: Verify worker
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          bun run test

      - name: Audit dependencies
        run: |
          bun audit
          (cd app && bun audit)
          (cd worker && bun audit)

      - name: Guard — tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.registry_tag || github.ref_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "$RELEASE_TAG" ] || { echo "Tag $RELEASE_TAG != package $PKG"; exit 1; }

      - name: Publish to npm (tags only, OIDC Trusted Publishing)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1
          npm publish --ignore-scripts

      - name: Wait for npm package availability
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          PACKAGE=$(node -p "encodeURIComponent(require('./package.json').name)")
          VERSION=$(node -p "require('./package.json').version")
          curl --fail --silent --show-error --retry 60 --retry-delay 5 \
            --retry-all-errors --retry-max-time 300 --max-time 15 \
            "https://registry.npmjs.org/$PACKAGE/$VERSION" -o /dev/null

      - name: Publish to MCP Registry (GitHub OIDC)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
